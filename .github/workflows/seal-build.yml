# Build-and-pack only: the test suite runs on Travis (.travis.yml).
name: seal-build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
      - name: Build jars
        run: ./mvnw -B -V clean package -DskipTests -Djacoco.skip=true -Danimal.sniffer.skip=true -Denforcer.skip=true
      - uses: actions/upload-artifact@v4
        with:
          name: commons-compress-jars
          path: |
            target/commons-compress-1.18.jar
            target/commons-compress-1.18-tests.jar
          if-no-files-found: error
