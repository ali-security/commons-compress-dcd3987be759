sudo: false
dist: focal
language: java

jdk:
  - openjdk8

# Travis can no longer provision openjdk7 / oraclejdk8 / oraclejdk9 / oraclejdk10
# (JAVA_HOME points at missing directories, oraclejdk10 is rejected outright), so
# those legs install the matching Azul Zulu JDK in before_install instead; the
# leg with an empty ZULU_JDK runs on Travis' own openjdk8.
env:
  global:
    - MAVEN_OPTS=-Dhttps.protocols=TLSv1.2
  jobs:
    - ZULU_JDK=zulu7.56.0.11-ca-jdk7.0.352-linux_x64
    - ZULU_JDK=
    - ZULU_JDK=zulu8.82.0.21-ca-jdk8.0.432-linux_x64
    - ZULU_JDK=zulu9.0.7.1-jdk9.0.7-linux_x64
    - ZULU_JDK=zulu10.3+5-jdk10.0.2-linux_x64

before_install:
  - if [ -n "$ZULU_JDK" ]; then curl -fsSL "https://cdn.azul.com/zulu/bin/${ZULU_JDK}.tar.gz" | tar xz -C "$HOME"; export JAVA_HOME="$HOME/$ZULU_JDK"; export PATH="$JAVA_HOME/bin:$PATH"; fi
  - java -version

cache:
  directories:
    - $HOME/.m2
    - .mvn
# don't run mvn install before building
install: true

# do all the building and testing in a single phase, instead of compiling everything three times
# and running all tests twice.

script:
   - ./mvnw clean test -Djacoco.skip=true -Danimal.sniffer.skip=true -Denforcer.skip=true

# list every skipped test with its reason (upstream @Ignore / Assume)
after_script:
   - grep -h -B1 "<skipped" target/surefire-reports/TEST-*.xml
   - echo "Skip reason - ArTestCase.XtestDirectoryEntryFromFile and ArTestCase.XtestExplicitDirectoryEntry are disabled upstream by a bare @Ignore (source comment says TODO revisit, does AR not support storing directories)."
   - echo "Skip reason - TarArchiveEntryTest.preservesDriveSpecOnWindowsAndNetwareIfAskedTo only applies on Windows or NetWare (assumeTrue that the filesystem root is the C drive), and these Travis legs run on Linux."
   - echo "Skip reason - BlockLZ4CompressorOutputStreamTest (2 tests) are @Ignore'd upstream as a known algorithm limitation; ZCompressorInputStreamTest is skipped on Java 9+ because PowerMock cannot run there."
